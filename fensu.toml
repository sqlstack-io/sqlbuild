[[targets.python.rule_exceptions]]
rule = "FFS120"
path = "src/sqlbuild/executor/scheduling/classes/recovering_connection_pool.py"
symbols = ["RecoveringConnectionPool.put"]
reason = "The override keeps queue.Queue.put's positional protocol, which every pool consumer calls."

[[targets.python.rule_exceptions]]
rule = "FFS201"
path = "src/sqlbuild/orchestration_declarations/models/sensor_context.py"
reason = "Only SensorContext lives here: invocation-local ctx.cursor assignment proposes progress, committed solely by native fenced completion. The package regression guards this declaration-only scope; class-symbol exceptions are unsupported."

[[dupes.allowlist]]
paths = ["crates/sqlbuild-analysis/src/analysis_route/_helpers/dialects/bigquery_dialect.rs", "crates/sqlbuild-analysis/src/analysis_route/_helpers/dialects/databricks_dialect.rs", "crates/sqlbuild-analysis/src/analysis_route/_helpers/dialects/duckdb_dialect.rs", "crates/sqlbuild-analysis/src/analysis_route/_helpers/dialects/postgres_dialect.rs", "crates/sqlbuild-analysis/src/analysis_route/_helpers/dialects/sqlite_dialect.rs"]
reason = "Each native module maps its own parser crate's StrictFailure, a distinct type per dialect, into a ParserGap, and decides per dialect whether an uncovered construct counts as syntax."

