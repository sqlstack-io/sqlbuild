[targets.python]
analyzer = "python"
roots = ["src/sqlbuild"]
tests = ["tests"]
tooling = ["scripts"]
rule_modules = [
    "scripts.fensu_policy.rules.adapter_ownership",
    "scripts.fensu_policy.rules.canonical_operations",
    "scripts.fensu_policy.rules.execution_observability",
    "scripts.fensu_policy.rules.module_boundaries",
    "scripts.fensu_policy.rules.native_boundary",
    "scripts.fensu_policy.rules.orchestration_dataflow",
    "scripts.fensu_policy.rules.source_hygiene",
]
select = ["FF", "XSB"]

[targets.python.cache]
enabled = true
require_cacheable = true

[targets.python.evaluation]
exclude = ["tests/e2e/fixtures/**"]

[targets.python.dead_code]
enabled = true

[[targets.python.dead_code.roots]]
modules = ["scripts.*"]
symbols = ["main"]
reason = "Repository tooling runs these modules with `python -m scripts.<name>` from the Makefile, CI and pre-commit."

[[targets.python.dead_code.roots]]
modules = ["scripts.fensu_policy.rules.*"]
symbols = ["*"]
reason = "Fensu loads these custom rule modules from rule_modules in this file."

[[targets.python.dead_code.roots]]
modules = [
    "sqlbuild.rule_engine._helpers.host.custom_host",
    "sqlbuild.rule_engine._helpers.host.custom_host_launch",
]
symbols = ["main"]
reason = "The custom-rule host processes run these modules with `python -m`; native code starts the launcher, which starts the host."

[[targets.python.dead_code.roots]]
modules = ["sqlbuild._native_host"]
symbols = ["*"]
reason = "Native code imports this module by path and reads its attributes by name."

