path = "crates/sqlbuild-analysis/src/assembly/analysis_session/models.rs"
reason = "NullabilityCallback implements Debug manually because it holds the adapter's nullability rule closure, which cannot implement Debug; other models derive it."

[[targets.rust.rule_exceptions]]
rule = "FPRSL105"
path = "crates/sqlbuild-core/src/screen_text/main/render_tree_group.rs"
reason = "Tree groups are the shared layout the compile, plan and build screens adopt next; the `sqb dev` screen ships them first so those screens reuse one renderer. Remove this exception when the first of them imports it."

[[targets.rust.rule_exceptions]]
rule = "FPRSH003"
path = "crates/sqlbuild-rules/src/build_identity/main/native_build_identity.rs"
symbols = ["native_build_identity"]
reason = "Every native entry point installs the build identity before anything reads it, so a missing identity is a programming error in a binary. Caches and rule fingerprints must never key on a substitute, and threading a Result through every infallible cache key and catalogue reader would only re-raise the same failure; a test covers the panic in a fresh process."

[[targets.rust.rule_exceptions]]
rule = "FPRSS130"
path = "crates/sqlbuild-core/src/process_environment/_helpers/overlay.rs"
symbols = ["replace"]
reason = "The environment overlay stands in for the process environment, which is process-wide by definition: the launcher installs the project's env file once before anything reads the environment, and sqb dev replaces it on reload. It replaces an unsafe std::env::set_var, so every reader and every child sees one environment."

[[targets.rust.rule_exceptions]]
rule = "FPRSS130"
path = "crates/sqlbuild-python/src/bindings/_helpers/command_runtime/connection.rs"
symbols = ["connection_config"]
reason = "A once-per-process warning is process state by definition: a command resolves its connection at startup for provider setup and again for its own work, and threading a flag through every caller would not guarantee once. Approved 17 Nov for this module only."

[[targets.rust.rule_exceptions]]
rule = "FPRSS130"
path = "crates/sqlbuild-analysis/src/sql_macros/_helpers/typing/typed_calls.rs"
symbols = ["marker_memo"]
reason = "Verifying typed markers parses the model once per marked call; the result depends only on the SQL, the calls and the dialect, so a bounded process-wide memo serves a compile's repeated reads and recompiles in long-lived processes."

[[targets.rust.rule_exceptions]]
rule = "FPRSS130"
path = "crates/sqlbuild-python-base/src/native_threads/_helpers/exit_signal.rs"
symbols = ["signal_interpreter_exit"]
reason = "The existing interpreter-exit signal is process-wide and monotonic: every native daemon wait must observe any exit hook before Python finalization. The atomic replaces the same global threading.Event, not per-command lifecycle state."

[[targets.rust.rule_exceptions]]
rule = "FPRSS130"
path = "crates/sqlbuild-cli/src/native_commands/_helpers/command/terminal.rs"
symbols = ["share_terminal"]
reason = "Whether a location's interpreter shares the terminal is process-wide and monotonic: once the supervisor starts it, every later write from any location task must first clear its spinner line."

