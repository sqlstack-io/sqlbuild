name: Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "ui/**"
      - ".github/workflows/website.yml"
  pull_request:
    paths:
      - "website/**"
      - "ui/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build sqlbuild.com
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            website/package-lock.json
            ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # The click-through demo at /demo: the web UI replaying a recording of DuckShop on sqb dev.
      - name: Build the UI demo
        working-directory: ui
        run: |
          npm ci
          SQB_UI_BASE=/demo VITE_SQB_DEMO=1 npm run build
          node scripts/demo-pages.mjs build demo/recording.json.gz ../website/dist/demo

      - name: Check links
        run: python3 scripts/check_links.py dist

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Check branding and responsive navigation
        run: npm test

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
