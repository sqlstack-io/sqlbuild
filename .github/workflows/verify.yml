    if: needs.changes.outputs.postgres == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            Cargo.lock
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: verify-linux
          save-if: false
      - name: Install Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --locked --all-groups --all-extras
      - name: Verify Docker
        run: docker info
      - name: Run PostgreSQL tests
        env:
          PYTHONUNBUFFERED: "1"
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: >-
          uv run pytest tests
          -m "real_warehouse and postgres"
          -vv --color=yes -n auto --dist loadfile

