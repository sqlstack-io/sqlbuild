  wheels:
    name: Wheels
    needs: [changes]
    if: needs.changes.outputs.wheels == 'true' && needs.changes.outputs.full == 'true'
    uses: ./.github/workflows/build-distributions.yml
    with:
      sdist: false
      upload: true
      retention-days: 3
      # Release Distributions builds and smoke tests the slower dist profile for every release.
      cargo-profile: release
      # Pull requests and merge groups build the wheel Compose installs; manual runs build every
      # platform, and Release Distributions builds every platform for each release.
      platforms: >-
        ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group')
        && 'linux-x86_64' || '' }}

  compose:
    name: Packaged Compose lifecycle
    needs: [changes, lockfile, wheels]
    if: needs.changes.outputs.wheels == 'true' && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-uv
        with:
          version: "0.12.3"
          enable-cache: true
      - name: Install Python test dependencies without rebuilding the packages
        run: |
          uv python install 3.12
          uv sync --locked --all-groups --all-extras --no-install-package sqlbuild --no-install-package sqlbuild-cli
      - uses: actions/download-artifact@v4
        with:
          name: dist-wheel-linux-x86_64
          path: dist
      - name: Install the same wheels used by the images
        run: uv pip install --no-deps dist/*.whl
      - name: Verify packaged Compose deployment and operational recovery
        run: make test-compose-packaged

  podman:
    name: Packaged Compose lifecycle on Podman
    needs: [changes, lockfile, wheels]
    if: needs.changes.outputs.podman == 'true' && needs.changes.outputs.wheels == 'true' && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      # The Docker CLI and its Compose plugin drive rootful Podman through its API socket.
      DOCKER_HOST: unix:///run/podman/podman.sock
      DOCKER_SOCKET: /run/podman/podman.sock
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-uv
        with:
          version: "0.12.3"
          enable-cache: true
      - name: Install Python test dependencies without rebuilding the packages
        run: |
          uv python install 3.12
          uv sync --locked --all-groups --all-extras --no-install-package sqlbuild --no-install-package sqlbuild-cli
      - uses: actions/download-artifact@v4
        with:
          name: dist-wheel-linux-x86_64
          path: dist
      - name: Install the same wheels used by the images
        run: uv pip install --no-deps dist/*.whl
      - name: Start the Podman API socket with group access for the runner
        run: |
          sudo systemctl start podman.socket
          sudo chmod 0711 /run/podman
          sudo chgrp "$(id -g)" /run/podman/podman.sock
          sudo chmod 0660 /run/podman/podman.sock
          podman --version
          docker version --format 'Podman API {{.Server.Version}}'
          docker compose version
      - name: Verify packaged Compose deployment and operational recovery
        run: make test-compose-packaged

  ui:
    name: UI checks and unit tests
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Build the static bundle sqb server embeds
        run: npm run build

  verify:
    # The required Verify of a Release Please pull request is the commit status that the trusted
    # release checks in release-please.yml post on the branch's current head, after the lockfile
    # refresh and every dispatched check. This job reports under another name there, so its quick
    # metadata-only pass can never satisfy Verify first; a skipped job would count as passing, so
    # the job always runs and only its name changes. Until those checks post Verify on the head,
    # the pull request waits for an expected check, and every new push to the branch waits again.
    # The same holds for a run started by an unrelated label, and for a fast-core run that leaves
    # out suites its change needs, unless the merge queue (SQLBUILD_MERGE_QUEUE) runs them.
    name: >-
      ${{ (github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && startsWith(github.event.pull_request.head.ref, 'release-please--branches--'))
      && 'Release pull request suites'
      || ((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'full-verify') && 'Label change (nothing verified)'
      || needs.changes.outputs.partial == 'true' && vars.SQLBUILD_MERGE_QUEUE != 'true'
      && 'Fast core (label full-verify for Verify)'
      || 'Verify' }}
    if: always()
    needs:
      [
        changes,
        lockfile,
        checks,
        native_checks,
        e2e_shards,
        compiler_differential,
        compiler_differential_python_versions,
        native_discovery_windows,
        scheduler_recovery,
        format_performance,
        performance,
        cold_compile_performance,
        dense_compile_performance,
        compile_performance_ratio,
        cache_compile_performance,
        rules_performance,
        postgres,
        clickhouse,
        wheels,
        compose,
        podman,
        ui,
      ]
    runs-on: ubuntu-24.04
    steps:
      - name: Confirm all required verification jobs passed
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CHECKS_SELECTED: ${{ needs.changes.outputs.checks }}
          LOCKFILE_RESULT: ${{ needs.lockfile.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          NATIVE_CHECKS_RESULT: ${{ needs.native_checks.result }}
          E2E_SHARDS_RESULT: ${{ needs.e2e_shards.result }}
          COMPILER_DIFFERENTIAL_RESULT: ${{ needs.compiler_differential.result }}
          COMPILER_DIFFERENTIAL_PYTHON_VERSIONS_RESULT: ${{ needs.compiler_differential_python_versions.result }}
          NATIVE_DISCOVERY_WINDOWS_RESULT: ${{ needs.native_discovery_windows.result }}
          SCHEDULER_RECOVERY_RESULT: ${{ needs.scheduler_recovery.result }}
          FORMAT_PERFORMANCE_RESULT: ${{ needs.format_performance.result }}
          PERFORMANCE_RESULT: ${{ needs.performance.result }}
          COLD_COMPILE_PERFORMANCE_RESULT: ${{ needs.cold_compile_performance.result }}
          DENSE_COMPILE_PERFORMANCE_RESULT: ${{ needs.dense_compile_performance.result }}
          COMPILE_PERFORMANCE_RATIO_RESULT: ${{ needs.compile_performance_ratio.result }}
          CACHE_COMPILE_PERFORMANCE_RESULT: ${{ needs.cache_compile_performance.result }}
          RULES_PERFORMANCE_RESULT: ${{ needs.rules_performance.result }}
          POSTGRES_RESULT: ${{ needs.postgres.result }}
          CLICKHOUSE_RESULT: ${{ needs.clickhouse.result }}
          WHEELS_RESULT: ${{ needs.wheels.result }}
          COMPOSE_RESULT: ${{ needs.compose.result }}
          PODMAN_RESULT: ${{ needs.podman.result }}
          UI_SELECTED: ${{ needs.changes.outputs.ui }}
          UI_RESULT: ${{ needs.ui.result }}
          LABEL_ONLY: ${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'full-verify' }}
          PARTIAL: ${{ needs.changes.outputs.partial }}
          DUCKDB_SELECTED: ${{ needs.changes.outputs.duckdb }}
          COMPILER_DIFFERENTIAL_SELECTED: ${{ needs.changes.outputs.compiler_differential }}
          RECOVERY_SELECTED: ${{ needs.changes.outputs.recovery }}
          FORMAT_PERFORMANCE_SELECTED: ${{ needs.changes.outputs.format_performance }}
          PERFORMANCE_SELECTED: ${{ needs.changes.outputs.performance }}
          POSTGRES_SELECTED: ${{ needs.changes.outputs.postgres }}
          CLICKHOUSE_SELECTED: ${{ needs.changes.outputs.clickhouse }}
          WHEELS_SELECTED: ${{ needs.changes.outputs.wheels }}
          PODMAN_SELECTED: ${{ needs.changes.outputs.podman }}
        run: |
          if [[ "${LABEL_ONLY}" == "true" ]]; then
            echo "A label other than full-verify changed; this run verifies nothing"
            exit 0
          fi
          if [[ "${CHANGES_RESULT}" != "success" || "${LOCKFILE_RESULT}" != "success" ]]; then
            echo "Required classification or lockfile checks did not pass" >&2
            exit 1
          fi
          for result in "${CHECKS_RESULT}" "${NATIVE_CHECKS_RESULT}"; do
            if [[ "${result}" != "success" ]] && \
               ! [[ "${CHECKS_SELECTED}" == "false" && "${result}" == "skipped" ]]; then
              echo "Required static or native checks did not pass: ${result}" >&2
              exit 1
            fi
          done
          if [[ "${WHEELS_RESULT}" == "success" && "${COMPOSE_RESULT}" != "success" ]]; then
            echo "Required packaged Compose verification did not pass: ${COMPOSE_RESULT}" >&2
            exit 1
          fi
          for result in \
            "${E2E_SHARDS_RESULT}" \
            "${COMPILER_DIFFERENTIAL_RESULT}" \
            "${COMPILER_DIFFERENTIAL_PYTHON_VERSIONS_RESULT}" \
            "${NATIVE_DISCOVERY_WINDOWS_RESULT}" \
            "${SCHEDULER_RECOVERY_RESULT}" \
            "${FORMAT_PERFORMANCE_RESULT}" \
            "${PERFORMANCE_RESULT}" \
            "${COLD_COMPILE_PERFORMANCE_RESULT}" \
            "${DENSE_COMPILE_PERFORMANCE_RESULT}" \
            "${COMPILE_PERFORMANCE_RATIO_RESULT}" \
            "${CACHE_COMPILE_PERFORMANCE_RESULT}" \
            "${RULES_PERFORMANCE_RESULT}" \
            "${POSTGRES_RESULT}" \
            "${CLICKHOUSE_RESULT}" \
            "${WHEELS_RESULT}" \
            "${COMPOSE_RESULT}" \
            "${PODMAN_RESULT}"; do
            if [[ "${result}" != "success" && "${result}" != "skipped" ]]; then
              echo "A selected verification suite did not pass: ${result}" >&2
              exit 1
            fi
          done
          if [[ "${UI_RESULT}" != "success" ]] && \
             ! [[ "${UI_SELECTED}" != "true" && "${UI_RESULT}" == "skipped" ]]; then
            echo "Required UI checks did not pass: ${UI_RESULT}" >&2
            exit 1
          fi
          # A full run must have run every suite its change selected; a skip here is never a pass.
          if [[ "${PARTIAL}" != "true" ]]; then
            for pair in \
              "${DUCKDB_SELECTED}:${E2E_SHARDS_RESULT}" \
              "${COMPILER_DIFFERENTIAL_SELECTED}:${COMPILER_DIFFERENTIAL_RESULT}" \
              "${COMPILER_DIFFERENTIAL_SELECTED}:${COMPILER_DIFFERENTIAL_PYTHON_VERSIONS_RESULT}" \
              "${COMPILER_DIFFERENTIAL_SELECTED}:${NATIVE_DISCOVERY_WINDOWS_RESULT}" \
              "${RECOVERY_SELECTED}:${SCHEDULER_RECOVERY_RESULT}" \
              "${FORMAT_PERFORMANCE_SELECTED}:${FORMAT_PERFORMANCE_RESULT}" \
              "${PERFORMANCE_SELECTED}:${COLD_COMPILE_PERFORMANCE_RESULT}" \
              "${PERFORMANCE_SELECTED}:${DENSE_COMPILE_PERFORMANCE_RESULT}" \
              "${PERFORMANCE_SELECTED}:${COMPILE_PERFORMANCE_RATIO_RESULT}" \
              "${PERFORMANCE_SELECTED}:${CACHE_COMPILE_PERFORMANCE_RESULT}" \
              "${POSTGRES_SELECTED}:${POSTGRES_RESULT}" \
              "${CLICKHOUSE_SELECTED}:${CLICKHOUSE_RESULT}" \
              "${WHEELS_SELECTED}:${WHEELS_RESULT}" \
              "${WHEELS_SELECTED}:${COMPOSE_RESULT}" \
              "${PODMAN_SELECTED}:${PODMAN_RESULT}"; do
              if [[ "${pair%%:*}" == "true" && "${pair#*:}" != "success" ]]; then
                echo "A suite this change needs did not run to success: ${pair#*:}" >&2
                exit 1
              fi
            done
          else
            echo "Fast core passed; the full matrix runs on full-verify, or in the merge queue when it verifies groups"
            exit 0
          fi
          echo "All path-relevant verification jobs passed"

  report_nightly:
    name: Report nightly failure
    needs: verify
    if: ${{ !cancelled() && github.event_name == 'schedule' && needs.verify.result == 'failure' }}
    runs-on: ubuntu-24.04
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Open or update the nightly Verify issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LABEL: nightly-verify
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "Nightly Verify failed at ${GITHUB_SHA} on main."
            echo
            echo "Run: ${RUN_URL}"
            echo
            echo "The nightly run adds the 5k and 10k-model compile jobs and every wheel platform."
          } > report.md
          gh label create "${LABEL}" --color B60205 \
            --description "The nightly Verify run on main failed" 2>/dev/null || true
          issue="$(gh issue list --label "${LABEL}" --state open --limit 1 \
            --json number --jq '.[0].number // empty')"
          if [[ -n "${issue}" ]]; then
            gh issue comment "${issue}" --body-file report.md
            echo "Updated issue #${issue}" >> "${GITHUB_STEP_SUMMARY}"
          else
            gh issue create --title "Nightly Verify failed on main" \
              --label "${LABEL}" --body-file report.md
          fi
          # The open issue holds releases (release-please.yml); stop a release pull request that
          # already passed its checks from merging before Release Please runs again.
          release_pr="$(gh pr list --state open --label "autorelease: pending" \
            --json number --jq '.[0].number // empty')"
          if [[ -n "${release_pr}" ]]; then
            gh pr merge "${release_pr}" --disable-auto 2>/dev/null || true
          fi
