[workspace]
members = [
    "crates/sqlbuild-build-features",
    "crates/sqlbuild-core",
    "crates/sqlbuild-cursor",
    "crates/sqlbuild-state",
    "crates/sqlbuild-pysource",
    "crates/sqlbuild-cache",
    "crates/sqlbuild-sqltext",
    "crates/sqlbuild-config",
    "crates/sqlbuild-host",
    "crates/sqlbuild-recall",
    "crates/sqlbuild-orchestration",
    "crates/sqlbuild-discovery",
    "crates/sqlbuild-scopes",
    "crates/sqlbuild-model-config",
    "crates/sqlbuild-render",
    "crates/sqlbuild-attachments",
    "crates/sqlbuild-analysis",
    "crates/sqlbuild-rules",
    "crates/sqlbuild-refactor",
    "crates/sqlbuild-project",
    "crates/sqlbuild-cli",
    "crates/sqlbuild-python",
]
resolver = "2"

# Native crates from the bottom up: each crate may depend only on crates listed before it.
# `make check-ci` enforces this, keeps PyO3 in the Python boundary crate and keeps polyglot
# out of every crate below the polyglot floor. See crates/README.md.
[workspace.metadata.native-layers]
order = [
    "sqlbuild-build-features",
    "sqlbuild-core",
    "sqlbuild-cursor",
    "sqlbuild-state",
    "sqlbuild-pysource",
    "sqlbuild-cache",
    "sqlbuild-sqltext",
    "sqlbuild-config",
    "sqlbuild-host",
    "sqlbuild-recall",
    "sqlbuild-orchestration",
    "sqlbuild-model-config",
    "sqlbuild-discovery",
    "sqlbuild-render",
    "sqlbuild-scopes",
    "sqlbuild-attachments",
    "sqlbuild-analysis",
    "sqlbuild-rules",
    "sqlbuild-refactor",
    "sqlbuild-project",
    "sqlbuild-cli",
    "sqlbuild-python",
]
python-boundary = "sqlbuild-python"
polyglot-floor = "sqlbuild-analysis"

[workspace.package]
version = "0.186.2"
edition = "2024"
license = "Apache-2.0"
publish = false
rust-version = "1.88"

[workspace.dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
fensu-policy = "=0.22.0"
# `sqb` names compute log captures with random ids, as `uuid.uuid4().hex`.
getrandom = "0.4"
globset = "0.4"
# Windows only: tells NTFS junctions, which Python walks as directories, from symbolic links.
junction = { version = "2.1.0", default-features = false }
# Python loads the extension with dlopen, so mimalloc must not use initial-exec TLS.
mimalloc = { version = "0.1", default-features = false, features = ["local_dynamic_tls"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
pyo3 = { version = "0.26", features = ["abi3-py312"] }
polyglot-sql = { git = "https://github.com/sqlstack-io/polyglot.git", rev = "8767d688c5b504ad609645e27ab77a260d91c5a1", default-features = false, features = [
    "ast-tools",
    "builder",
    "all-dialects",
    "semantic",
    "stacker",
] }
polyglot-sql-function-catalogs = { git = "https://github.com/sqlstack-io/polyglot.git", rev = "8767d688c5b504ad609645e27ab77a260d91c5a1", default-features = false, features = [
    "dialect-duckdb",
] }
blake3 = { version = "1", features = ["rayon"] }
# Only sqlbuild-build-features uses these: each enables in the sqb build exactly the features the
# extension build resolves for that crate, so both builds share one compile of every common crate.
arrayvec = "0.7"
bstr = "1"
either = { version = "1", default-features = false, features = ["use_std"] }
memchr = "2"
once_cell = "1"
regex-automata = { version = "0.4", default-features = false, features = ["dfa-search"] }
syn-v2-macro-features = { package = "syn", version = "2", default-features = false, features = ["extra-traits", "fold", "visit-mut"] }
syn-v3-macro-features = { package = "syn", version = "3", default-features = false, features = ["extra-traits", "full"] }
thiserror = "2"
# Windows only: `sqb` ignores Ctrl+C while the Python CLI it started handles it.
ctrlc = "3"
quote = "1"
rayon = "1"
# Static reading of project Python source; the parser fensu uses.
ruff_python_ast = "=0.0.4"
ruff_python_parser = "=0.0.4"
ruff_text_size = "=0.0.4"
# Unix only: `sqb` shares the compute log prune lock with Python's `filelock` through `flock`.
# Fast deterministic hasher for hot in-memory maps whose iteration order never reaches output.
rustc-hash = "2"
# The native SIGTERM handler: sets a flag the CLI watches, without unsafe code in the workspace.
signal-hook = { version = "0.3", default-features = false }
# Features signal-hook's registry enables, matched in the sqb build through sqlbuild-build-features.
errno = "0.3"
windows-sys = { version = "0.61", default-features = false, features = ["Win32_System_Diagnostics_Debug"] }
# Recall's local store: SQLite compiled in, so every build has the same engine version.
rusqlite = { version = "0.37", features = ["bundled", "column_decltype"] }
rustix = { version = "1.1.4", default-features = false, features = ["fs", "process", "std", "termios"] }
saphyr-parser = "0.1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
# Every crate relies on insertion-ordered JSON objects, which the extension has always built with.
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
croner = "=3.0.1"
flate2 = "1"
proptest = "1"
same-file = "1"
semver = "1"
# Pin SQLx's driver crates together: its umbrella also resolves an incompatible SQLite engine.
sqlx-core = { version = "=0.8.6", default-features = false, features = ["_rt-tokio", "_tls-rustls-ring-webpki", "chrono", "uuid", "json"] }
sqlx-postgres = { version = "=0.8.6", default-features = false, features = ["chrono", "uuid", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal", "process", "net"] }
uuid = { version = "=1.18.1", features = ["v5", "v7", "serde"] }
utoipa = { version = "5", features = ["chrono", "uuid"] }
sqlbuild-analysis = { path = "crates/sqlbuild-analysis" }
sqlbuild-attachments = { path = "crates/sqlbuild-attachments" }
sqlbuild-build-features = { path = "crates/sqlbuild-build-features" }
sqlbuild-cache = { path = "crates/sqlbuild-cache" }
sqlbuild-cli = { path = "crates/sqlbuild-cli" }
sqlbuild-config = { path = "crates/sqlbuild-config" }
sqlbuild-core = { path = "crates/sqlbuild-core" }
sqlbuild-cursor = { path = "crates/sqlbuild-cursor" }
sqlbuild-discovery = { path = "crates/sqlbuild-discovery" }
sqlbuild-host = { path = "crates/sqlbuild-host" }
sqlbuild-render = { path = "crates/sqlbuild-render" }
sqlbuild-refactor = { path = "crates/sqlbuild-refactor" }
sqlbuild-rules = { path = "crates/sqlbuild-rules" }
sqlbuild-model-config = { path = "crates/sqlbuild-model-config" }
sqlbuild-orchestration = { path = "crates/sqlbuild-orchestration" }
sqlbuild-project = { path = "crates/sqlbuild-project" }
sqlbuild-pysource = { path = "crates/sqlbuild-pysource" }
sqlbuild-recall = { path = "crates/sqlbuild-recall" }
sqlbuild-scopes = { path = "crates/sqlbuild-scopes" }
sqlbuild-sqltext = { path = "crates/sqlbuild-sqltext" }
sqlbuild-state = { path = "crates/sqlbuild-state" }
stacker = "0.1"
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
subtle = "2"
tempfile = "3"
toml = "0.9"
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }
toml_parser = "1"
walkdir = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
await_holding_lock = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
debug = false

[profile.release]
strip = "symbols"

# Local iteration: release-level optimisation with incremental builds, so rebuilding after a
# focused change does not recompile the whole binding crate. CI and wheels use `release`.
[profile.fast]
inherits = "release"
incremental = true
codegen-units = 256
strip = "none"
