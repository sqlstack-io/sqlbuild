[workspace]
members = [
    "crates/sqlbuild-build-features",
    "crates/sqlbuild-build-identity",
    "crates/sqlbuild-core",
    "crates/sqlbuild-cursor",
    "crates/sqlbuild-process-ownership",
    "crates/sqlbuild-state",
    "crates/sqlbuild-pysource",
    "crates/sqlbuild-cache",
    "crates/sqlbuild-sqltext",
    "crates/sqlbuild-config",
    "crates/sqlbuild-host",
    "crates/sqlbuild-recall",
    "crates/sqlbuild-orchestration",
    "crates/sqlbuild-discovery",
    "crates/sqlbuild-scopes",
    "crates/sqlbuild-model-config",
    "crates/sqlbuild-render",
    "crates/sqlbuild-attachments",
    "crates/sqlbuild-analysis",
    "crates/sqlbuild-rules",
    "crates/sqlbuild-refactor",
    "crates/sqlbuild-project",
    "crates/sqlbuild-cli",
    "crates/sqlbuild-load",
    "crates/sqlbuild-python-base",
    "crates/sqlbuild-python-front",
    "crates/sqlbuild-python-project",
    "crates/sqlbuild-python-planner",
    "crates/sqlbuild-python-compile",
    "crates/sqlbuild-python-output",
    "crates/sqlbuild-python",
]
resolver = "2"

# Native crates from the bottom up: each crate may depend only on crates listed before it.
# `make check-ci` enforces this, keeps PyO3 in the Python boundary crate and keeps polyglot
# out of every crate below the polyglot floor. See crates/README.md.
[workspace.metadata.native-layers]
order = [
    "sqlbuild-build-features",
    "sqlbuild-build-identity",
    "sqlbuild-core",
    "sqlbuild-cursor",
    "sqlbuild-process-ownership",
    "sqlbuild-state",
    "sqlbuild-pysource",
    "sqlbuild-cache",
    "sqlbuild-sqltext",
    "sqlbuild-config",
    "sqlbuild-host",
    "sqlbuild-recall",
    "sqlbuild-model-config",
    "sqlbuild-orchestration",
    "sqlbuild-discovery",
    "sqlbuild-render",
    "sqlbuild-scopes",
    "sqlbuild-attachments",
    "sqlbuild-analysis",
    "sqlbuild-rules",
    "sqlbuild-refactor",
    "sqlbuild-project",
    "sqlbuild-cli",
    "sqlbuild-load",
    "sqlbuild-python-base",
    "sqlbuild-python-front",
    "sqlbuild-python-project",
    "sqlbuild-python-planner",
    "sqlbuild-python-compile",
    "sqlbuild-python-output",
    "sqlbuild-python",
]
python-boundary = ["sqlbuild-python-base", "sqlbuild-python-front", "sqlbuild-python-project", "sqlbuild-python-planner", "sqlbuild-python-compile", "sqlbuild-python-output", "sqlbuild-python"]
polyglot-floor = "sqlbuild-analysis"

[workspace.package]
# Fixed on purpose: a crate's version is part of its Cargo build identity, so a shared release
# version would recompile every crate after each release. The release version lives in the
# sqlbuild-cli and sqlbuild-python manifests; see crates/README.md.
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false
rust-version = "1.88"

[workspace.dependencies]
# Reads the project env file with dotenv semantics; sqlx-postgres already depends on it.
dotenvy = "0.15.7"
argon2 = "0.5.3"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
# Compresses the server's larger JSON reads and UI assets for browsers.
tower-http = { version = "0.6", default-features = false, features = ["compression-gzip"] }
# Tests drive the API router in process, with a chosen socket peer.
tower = { version = "0.5", default-features = false, features = ["util"] }
fensu-policy = "=0.22.0"
# Fensu's Python facts and core rules without their Python bindings: the default `python`
# feature adds PyO3, rusqlite, flate2 and sha2.
fensu-facts = { version = "=0.31.2", default-features = false }
fensu-native = { version = "=0.31.2", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# `sqb` names compute log captures with random ids, as `uuid.uuid4().hex`.
getrandom = "0.4"
globset = "0.4"
# Gitignore matching for the project layout check.
ignore = "0.4"
# Windows only: tells NTFS junctions, which Python walks as directories, from symbolic links.
junction = { version = "2.1.0", default-features = false }
keyring = { version = "3.6.3", default-features = false }
# Python loads the extension with dlopen, so mimalloc must not use initial-exec TLS.
# no_thp: mimalloc otherwise asks for transparent huge pages on its 1 GiB arenas, and each
# partly used 2 MiB page then stays resident in full, which raises peak memory.
mimalloc = { version = "0.1", default-features = false, features = ["local_dynamic_tls", "no_thp"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
pyo3 = { version = "0.26", features = ["abi3-py312"] }
rpassword = "7.5.4"
rcgen = "0.14"
polyglot-sql = { git = "https://github.com/sqlstack-io/polyglot.git", rev = "8767d688c5b504ad609645e27ab77a260d91c5a1", default-features = false, features = [
    "ast-tools",
    "builder",
    "all-dialects",
    "semantic",
    "stacker",
] }
blake3 = { version = "1", features = ["rayon"] }
# Only sqlbuild-build-features uses these: each enables in the sqb build exactly the features the
# extension build resolves for that crate, so both builds share one compile of every common crate.
arrayvec = "0.7"
bstr = "1"
either = { version = "1", default-features = false, features = ["use_std"] }
memchr = "2"
once_cell = "1"
openidconnect = { version = "4.1", default-features = false, features = ["reqwest", "rustls-tls"] }
regex-automata = { version = "0.4", default-features = false, features = ["dfa-search"] }
syn-v2-macro-features = { package = "syn", version = "2", default-features = false, features = ["extra-traits", "fold", "visit-mut"] }
syn-v3-macro-features = { package = "syn", version = "3", default-features = false, features = ["extra-traits", "full"] }
thiserror = "2"
# Windows only: `sqb` ignores Ctrl+C while the Python CLI it started handles it.
ctrlc = "3"
command-fds = "0.3"
libc = "0.2"
quote = "1"
rayon = "1"
# Static reading of project Python source; the parser fensu uses.
ruff_python_ast = "=0.0.4"
ruff_python_parser = "=0.0.4"
ruff_text_size = "=0.0.4"
# Unix only: `sqb` shares the compute log prune lock with Python's `filelock` through `flock`.
# Fast deterministic hasher for hot in-memory maps whose iteration order never reaches output.
rustc-hash = "2"
# The native SIGTERM handler: sets a flag the CLI watches, without unsafe code. The only crate
# allowed unsafe code is sqlbuild-process-ownership, for the platform calls that prove which
# process owns a worker claim; every other crate forbids it.
signal-hook = { version = "0.3", default-features = false }
# Features signal-hook's registry enables, matched in the sqb build through sqlbuild-build-features.
errno = "0.3"
windows-sys = { version = "0.61", default-features = false, features = ["Win32_System_Diagnostics_Debug"] }
# Recall's local store: SQLite compiled in, so every build has the same engine version.
rusqlite = { version = "0.37", features = ["bundled", "column_decltype"] }
rustix = { version = "1.1.4", default-features = false, features = ["event", "fs", "process", "pty", "std", "stdio", "termios"] }
saphyr-parser = "0.1"
regex = "1"
# aws-base and ring, not aws: object_store's aws feature, like reqwest's rustls feature, compiles in
# aws-lc-rs beside ring, after which rustls no longer picks its provider by itself. SQLLoad uses ring.
object_store = { version = "0.14", default-features = false, features = ["fs", "aws-base", "reqwest", "ring"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls-no-provider"] }
# The ring provider that `sqlbuild_orchestration::tls` installs before any client is built.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# The loading engine behind loads, loaders and sinks: its library, without its CLI or its own DuckDB.
sqlload = { version = "=0.85.0", default-features = false }
serde = { version = "1", features = ["derive"] }
# Reports every field a decode ignores; a worker refuses a run request it can only partly read.
serde_ignored = "0.1"
# Names where a decode failed; with serde_ignored, a worker names any part of a run request it can't read.
serde_path_to_error = "0.1"
# Every crate relies on insertion-ordered JSON objects, which the extension has always built with.
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
croner = "=3.0.1"
flate2 = "1"
zstd = { version = "0.13", default-features = false }
proptest = "1"
same-file = "1"
semver = "1"
# Pin SQLx's driver crates together: its umbrella also resolves an incompatible SQLite engine.
sqlx-core = { version = "=0.8.6", default-features = false, features = ["_rt-tokio", "_tls-rustls-ring-webpki", "chrono", "uuid", "json"] }
sqlx-postgres = { version = "=0.8.6", default-features = false, features = ["chrono", "uuid", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal", "process", "net"] }
uuid = { version = "=1.18.1", features = ["v5", "v7", "serde"] }
utoipa = { version = "5", features = ["chrono", "uuid"] }
sqlbuild-analysis = { path = "crates/sqlbuild-analysis" }
sqlbuild-attachments = { path = "crates/sqlbuild-attachments" }
sqlbuild-build-features = { path = "crates/sqlbuild-build-features" }
sqlbuild-build-identity = { path = "crates/sqlbuild-build-identity" }
sqlbuild-cache = { path = "crates/sqlbuild-cache" }
sqlbuild-cli = { path = "crates/sqlbuild-cli" }
sqlbuild-config = { path = "crates/sqlbuild-config" }
sqlbuild-core = { path = "crates/sqlbuild-core" }
sqlbuild-cursor = { path = "crates/sqlbuild-cursor" }
sqlbuild-discovery = { path = "crates/sqlbuild-discovery" }
sqlbuild-load = { path = "crates/sqlbuild-load" }
sqlbuild-host = { path = "crates/sqlbuild-host" }
sqlbuild-render = { path = "crates/sqlbuild-render" }
sqlbuild-refactor = { path = "crates/sqlbuild-refactor" }
sqlbuild-rules = { path = "crates/sqlbuild-rules" }
sqlbuild-model-config = { path = "crates/sqlbuild-model-config" }
sqlbuild-orchestration = { path = "crates/sqlbuild-orchestration" }
sqlbuild-process-ownership = { path = "crates/sqlbuild-process-ownership" }
sqlbuild-project = { path = "crates/sqlbuild-project" }
sqlbuild-python-base = { path = "crates/sqlbuild-python-base" }
sqlbuild-python-front = { path = "crates/sqlbuild-python-front" }
sqlbuild-python-project = { path = "crates/sqlbuild-python-project" }
sqlbuild-python-planner = { path = "crates/sqlbuild-python-planner" }
sqlbuild-python-compile = { path = "crates/sqlbuild-python-compile" }
sqlbuild-python-output = { path = "crates/sqlbuild-python-output" }
sqlbuild-pysource = { path = "crates/sqlbuild-pysource" }
sqlbuild-recall = { path = "crates/sqlbuild-recall" }
sqlbuild-scopes = { path = "crates/sqlbuild-scopes" }
sqlbuild-sqltext = { path = "crates/sqlbuild-sqltext" }
sqlbuild-state = { path = "crates/sqlbuild-state" }
# SQL lint Rules, quality Rules and the formatter.
sqlclean = { git = "https://github.com/sqlstack-io/sqlclean.git", rev = "462a98779a2a11ff11884ff79feefbfb190ab8d1" }
# SQL change fingerprints over SQLQuack's tokenizers.
sqlquack-fingerprint = { git = "https://github.com/sqlstack-io/sqlquack.git", rev = "63d0ce3baf8c981fac3c7164cbeb653f3ddb83a9", features = ["bigquery", "databricks", "duckdb", "postgres", "snowflake", "sqlite", "sqlserver"] }
# Scopes, name resolution, types and lineage for the native analysis route.
sqlquack-semantics = { git = "https://github.com/sqlstack-io/sqlquack.git", rev = "63d0ce3baf8c981fac3c7164cbeb653f3ddb83a9", features = ["bigquery", "clickhouse", "databricks", "duckdb", "postgres", "snowflake", "sqlite", "sqlserver"] }
# SQLQuack's Snowflake-family parser and tokenizer, reached as SQLQuack exposes them.
sqlquack-parse = { git = "https://github.com/sqlstack-io/sqlquack.git", rev = "63d0ce3baf8c981fac3c7164cbeb653f3ddb83a9" }
# SQLQuack's syntax tree and lossless tokens.
sqlquack-syntax = { git = "https://github.com/sqlstack-io/sqlquack.git", rev = "63d0ce3baf8c981fac3c7164cbeb653f3ddb83a9" }
# SQLQuack's tokenizer: lossless tokens and tokenize failures.
sqlquack-tokenize = { git = "https://github.com/sqlstack-io/sqlquack.git", rev = "63d0ce3baf8c981fac3c7164cbeb653f3ddb83a9" }
sqlquack-syntax-bigquery = { git = "https://github.com/sqlstack-io/sqlquack.git", rev = "63d0ce3baf8c981fac3c7164cbeb653f3ddb83a9" }
sqlquack-syntax-clickhouse = { git = "https://github.com/sqlstack-io/sqlquack.git", rev = "63d0ce3baf8c981fac3c7164cbeb653f3ddb83a9" }
sqlquack-syntax-databricks = { git = "https://github.com/sqlstack-io/sqlquack.git", rev = "63d0ce3baf8c981fac3c7164cbeb653f3ddb83a9" }
sqlquack-syntax-duckdb = { git = "https://github.com/sqlstack-io/sqlquack.git", rev = "63d0ce3baf8c981fac3c7164cbeb653f3ddb83a9" }
sqlquack-syntax-postgres = { git = "https://github.com/sqlstack-io/sqlquack.git", rev = "63d0ce3baf8c981fac3c7164cbeb653f3ddb83a9" }
sqlquack-syntax-sqlite = { git = "https://github.com/sqlstack-io/sqlquack.git", rev = "63d0ce3baf8c981fac3c7164cbeb653f3ddb83a9" }
sqlquack-syntax-sqlserver = { git = "https://github.com/sqlstack-io/sqlquack.git", rev = "63d0ce3baf8c981fac3c7164cbeb653f3ddb83a9" }
stacker = "0.1"
# Counts heap allocations in growth tests, which measure work instead of time.
stats_alloc = "0.1"
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
subtle = "2"
tempfile = "3"
toml = "0.9"
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }
toml_parser = "1"
walkdir = "2"

# Named only by sqlbuild-build-features, which enables in the sqb build the features the extension
# resolves for these crates (see its manifest); no other crate uses them.
aead = { version = "0.6", default-features = false }
aes = { version = "0.9", default-features = false }
aes-gcm = { version = "0.11", default-features = false }
async-compression = { version = "0.4", default-features = false }
bitflags = { version = "2.13", default-features = false }
byteorder = { version = "1.5", default-features = false }
chacha20 = { version = "0.10", default-features = false }
cipher = { version = "0.5", default-features = false }
compression-codecs = { version = "0.4", default-features = false }
crc32fast = { version = "1.5", default-features = false }
crypto-bigint = { version = "0.7", default-features = false }
curve25519-dalek = { version = "5.0", default-features = false }
digest = { version = "0.11", default-features = false }
ecdsa = { version = "0.17", default-features = false }
ed25519-dalek = { version = "3.0", default-features = false }
elliptic-curve = { version = "0.14", default-features = false }
generic-array = { version = "0.14", default-features = false }
getrandom-v03 = { package = "getrandom", version = "0.3", default-features = false }
ghash = { version = "0.6", default-features = false }
hashbrown = { version = "0.17", default-features = false }
hybrid-array = { version = "0.4", default-features = false }
hyper-rustls = { version = "0.27", default-features = false }
hyper-util = { version = "0.1", default-features = false }
md-5 = { version = "0.11", default-features = false }
nix = { version = "0.31", default-features = false }
num-integer = { version = "0.1", default-features = false }
p256 = { version = "0.14", default-features = false }
p384 = { version = "0.14", default-features = false }
pkcs8 = { version = "0.11", default-features = false }
polyval = { version = "0.7", default-features = false }
rand = { version = "0.10", default-features = false }
reqwest-v012 = { package = "reqwest", version = "0.12", default-features = false }
ring = { version = "0.17", default-features = false }
sha2-v011 = { package = "sha2", version = "0.11", default-features = false }
simd-adler32 = { version = "0.3", default-features = false }
tokio-rustls = { version = "0.26", default-features = false }
tokio-stream = { version = "0.1", default-features = false }
tokio-util = { version = "0.7", default-features = false }
toml_writer = { version = "1.1", default-features = false }
zerocopy = { version = "0.8", default-features = false }
zeroize = { version = "1.9", default-features = false }
zstd-safe = { version = "8.4", default-features = false }
zstd-sys = { version = "2.2", default-features = false }
zstd-v014 = { package = "zstd", version = "0.14", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
await_holding_lock = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
debug = false

[profile.release]
strip = "symbols"

# Released wheels: Cargo's default 16 codegen units per crate. One unit made the binaries about an
# eighth of the size but doubled build time, and macOS wheel builds took 60-90 minutes.
[profile.dist]
inherits = "release"

# Local iteration: release-level optimisation with incremental builds, so rebuilding after a
# focused change does not recompile the whole binding crate. CI uses `release`.
[profile.fast]
inherits = "release"
incremental = true
codegen-units = 256
strip = "none"
