[package]
name = "sqlbuild-cli"
version.workspace = true
description = "The native `sqb` executable: reused compiles and Python-free commands served without Python, every other command handed to the Python CLI."
edition.workspace = true
license-file = "LICENSE"
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "sqb"
path = "src/bin/sqb.rs"

[[bin]]
name = "sqlbuild"
path = "src/bin/sqlbuild.rs"

[dependencies]
blake3.workspace = true
chrono.workspace = true
getrandom.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["arbitrary_precision"] }
sqlbuild-build-features.workspace = true
sqlbuild-cache.workspace = true
sqlbuild-config.workspace = true
sqlbuild-core.workspace = true
sqlbuild-cursor.workspace = true
sqlbuild-model-config.workspace = true
sqlbuild-orchestration.workspace = true
sqlbuild-rules.workspace = true
tokio.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
ctrlc.workspace = true
same-file.workspace = true

[dev-dependencies]
rusqlite.workspace = true
tempfile.workspace = true

[lints]
workspace = true
