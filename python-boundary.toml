# Python that stays once Rust hosts SQLBuild. Every other Python file under src/sqlbuild is
# migration work that moves to Rust. `remaining_lines` must equal the current count of that work:
# a PR that moves code lowers it, and adding movable Python fails the check.
# Each `[[stays]]` entry names the one rule that keeps it Python and a note with the evidence:
# 1 = executor or adapter runtime and the shapes it consumes; 2 = thin shim that invokes user
# Python; 3 = public facade (facade only); 4 = glue around a Python-only third-party library.
# Native failures must surface as errors; `handled_native_errors` lists the reviewed exceptions.
# Zero movable Python lines does not mean zero Python objects at the native boundary. Public
# records and callback-based graph APIs retain Python values, hashing and equality; caller-authored
# scopes are imported at entry. Adapter/executor requests and results, user code and opaque config
# leaves also cross intentionally. Native-owned graph walks and model lookups use retained scope
# data instead of projecting those public containers and immediately reading them back.
remaining_lines = 0

