name = "orders"
adapter = "sqlite"
default_target = "development"

[connection]
path = "must-not-open.db"
password = "${ENV:SQLBUILD_MISSING_WRITER_PASSWORD}"

[connections.writer]
path = "must-not-open-writer.db"

[connections.catalog]
path = "${ENV:SQLBUILD_CATALOG_DATABASE}"

[targets.development]
connection = "writer"
catalog_connection = "catalog"
schema = "main"
