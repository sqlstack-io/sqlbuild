[[rules.rule_exceptions]]
rule = "SQLCLEAN034"
path = "models/staging/_sqlbuild/macros/sql/load_metadata.sql"
reason = """
A column-list macro body is a select list by construction. Its columns are inserted into the
caller's own CTE, where the rule is checked again.
"""

[[rules.rule_exceptions]]
rule = "SQLCLEAN034"
path = "macros/sql/money_columns.sql"
reason = """
A column-list macro body is a select list by construction. Its columns are inserted into the
caller's own CTE, where the rule is checked again.
"""

[[rules.rule_exceptions]]
rule = "SQLCLEAN028"
path = "models/intermediate/catalogue/int_category_paths.sql"
reason = """
LEVEL and the CONNECT_BY_ROOT operator are hierarchical-query pseudo-columns that cannot be
qualified with a table alias.
"""

[[rules.rule_exceptions]]
rule = "SQBRTEST202"
path = "models/intermediate/catalogue/int_category_paths.sql"
reason = """
Unit-test fixture checking treats the LEVEL pseudo-column as a column the mocked categories
relation must supply, so no test of this model can compile yet. The
category_tree__rolls_sales_up_built_paths scenario builds the hierarchy from a source fixture instead.
"""

[[rules.rule_exceptions]]
rule = "SQBRTEST202"
path = "models/intermediate/clickstream/int_cart_funnel.sql"
reason = """
Unit-test fixture checking treats the FILTER, TRANSFORM and REDUCE lambda parameters (i, acc, q) as
columns the mocked relations must supply, so no test of this model can compile yet. The
cart_funnel__assigns_furthest_stage_per_session scenario covers the funnel instead.
"""

[[rules.rule_exceptions]]
rule = "SQLCLEAN038"
path = "models/marts/executive/rpt_executive_kpis_daily.sql"
relation = "metric_regions"
reason = """
The KPI grid is every reporting day for every region and metric pair that has ever had a value, so
days without activity report zero instead of disappearing. Both sides are small and bounded.
"""

# >>> edge-case area (scripts/core_project.py leaves this block out of the core copy)
[[rules.rule_ignores]]
rules = ["SQLCLEAN027"]
paths = ["models/marts/edge_cases/rpt_edge_stock_reconciliation.sql"]
reason = """
The edge case selects the key columns that FULL OUTER JOIN ... USING merges. They belong to neither
side, so qualifying them with either alias would drop the keys of rows found only on the other side.
"""

[[rules.rule_ignores]]
rules = ["SQLCLEAN003", "SQLCLEAN023", "SQLCLEAN027", "SQLCLEAN051"]
paths = ["models/intermediate/edge_cases/int_edge_join_keys.sql"]
reason = """
The edge cases read the merged key of RIGHT JOIN ... USING and of a USING join followed by an outer
join unqualified, because it belongs to neither side; the side aliases are then unused. An ASOF
JOIN's condition is its MATCH_CONDITION, so it has no ON clause. The NATURAL JOIN is the case
under test.
"""

[[rules.rule_ignores]]
rules = ["SQLCLEAN018"]
paths = [
  "models/intermediate/edge_cases/int_edge_grouped_windows.sql",
  "models/intermediate/edge_cases/int_edge_null_arithmetic.sql",
]
reason = """
The ranking windows order by the group code of a grouped query and by the check id, both unique
where they are ranked, which Rules cannot prove through a GROUP BY or a CTE.
"""

[[rules.rule_ignores]]
rules = ["SQLCLEAN022"]
paths = ["models/intermediate/edge_cases/int_edge_analysis_patterns.sql"]
reason = """
The edge case leaves two calculated columns unaliased on purpose, and reads them by the names
Snowflake gives them.
"""

[[rules.rule_ignores]]
rules = ["SQLCLEAN027", "SQLCLEAN028"]
paths = ["models/intermediate/edge_cases/int_edge_category_walk.sql"]
reason = """
LEVEL and CONNECT_BY_ROOT belong to the walk, not to a relation, so they cannot be qualified, and
the edge case reads a column named level from another relation unqualified inside a scalar
subquery on purpose.
"""

