name = "duckshop"
adapter = "snowflake"
default_target = "dev"

# Placeholders only. Real connection details belong in the untracked sqlbuild_local.toml;
# see sqlbuild_local.toml.example. Compiling needs no connection.
[connections.warehouse]
account = "example-account"
user = "example_user"
role = "EXAMPLE_ROLE"
warehouse = "EXAMPLE_WH"

[targets.dev]
connection = "warehouse"
database = "DUCKSHOP"
schema = "DEV"

[targets.prod]
connection = "warehouse"
database = "DUCKSHOP"
schema = "ANALYTICS"

# >>> edge-case area (scripts/core_project.py leaves this block out of the core copy)
# The edge-case area's expected values are captured on Snowflake under this pinned session: UTC,
# with every parameter that changes a result or how text is parsed set to Snowflake's default.
# Run the edge area on this connection only (see RUNBOOK.md, step 7).
[connections.edge]
account = "example-account"
user = "example_user"
role = "EXAMPLE_ROLE"
warehouse = "EXAMPLE_WH"

[connections.edge.session_parameters]
TIMEZONE = "UTC"
TIMESTAMP_TYPE_MAPPING = "TIMESTAMP_NTZ"
WEEK_START = 0
WEEK_OF_YEAR_POLICY = 0
DEFAULT_NULL_ORDERING = "LAST"
QUOTED_IDENTIFIERS_IGNORE_CASE = false
USE_CACHED_RESULT = false
DATE_INPUT_FORMAT = "AUTO"
DATE_OUTPUT_FORMAT = "YYYY-MM-DD"
TIME_INPUT_FORMAT = "AUTO"
TIME_OUTPUT_FORMAT = "HH24:MI:SS"
TIMESTAMP_INPUT_FORMAT = "AUTO"
TIMESTAMP_OUTPUT_FORMAT = "YYYY-MM-DD HH24:MI:SS.FF3 TZHTZM"
TIMESTAMP_NTZ_OUTPUT_FORMAT = "YYYY-MM-DD HH24:MI:SS.FF3"
TIMESTAMP_LTZ_OUTPUT_FORMAT = ""
TIMESTAMP_TZ_OUTPUT_FORMAT = ""
TWO_DIGIT_CENTURY_START = 1970
BINARY_INPUT_FORMAT = "HEX"
BINARY_OUTPUT_FORMAT = "HEX"
TIMESTAMP_DAY_IS_ALWAYS_24H = false
JSON_INDENT = 2
STRICT_JSON_OUTPUT = false

[targets.edge]
connection = "edge"
database = "DUCKSHOP"
schema = "EDGE"
# <<< edge-case area

[settings]
default_audit_severity = "error"
unit_test_max_real_models = 6
test_timeout = "60s"
scenario_timeout = "10m"

[defaults]
materialized = "table"

[path_defaults.staging]
materialized = "view"
tags = ["staging"]

[path_defaults.intermediate]
materialized = "table"
tags = ["intermediate"]

[path_defaults.marts]
materialized = "table"
tags = ["marts"]

[path_defaults.snapshots]
tags = ["snapshots"]

[vars]
reporting_currency = "USD"
# Fixed valuation date for balance and liability models, so their output is reproducible.
valuation_date = "2026-03-31"
# Customer shown by the order lookup report; override per run with --vars.
lookup_customer_id = "C000001"
# Volume multiplier for the synthetic data loaders in python/loaders; 1 is the small default.
data_scale = "1"
# >>> edge-case area (scripts/core_project.py leaves this block out of the core copy)
# Last load of the edge-case delivery change log to include; "1" replays the first load only (see
# RUNBOOK.md, step 7).
edge_delivery_batch = "2"
# <<< edge-case area

[scenario.local_type_overrides.snowflake]
"VARIANT" = "JSON"
"OBJECT" = "JSON"
"ARRAY" = "JSON"

[rules]
select = ["SQLCLEAN", "SQBRGRAPH", "SQBRCONTRACT", "SQBRTEST", "XSQBRDUCK"]
# SQLCLEAN021: `SELECT * FROM final` and the change-log macro's pass-through CTEs are the house
#   style; each model's columns block, not its terminal SELECT, owns the output shape.
# SQBRCONTRACT101: exact contracts are reserved for published dim_ and fct_ models.
ignore = ["SQLCLEAN021", "SQBRCONTRACT101"]

[[rules.rule_exceptions]]
rule = "SQLCLEAN018"
path = "models/staging/_sqlbuild/macros/sql/cdc_latest.sql"
reason = """
The macro cannot see its callers' keys on its own. Every call site is still checked, against the
unique, non-null _seq that each change-log source declares.
"""

[[rules.rule_exceptions]]
rule = "SQLCLEAN018"
path = "models/marts/core/dim_date.sql"
reason = """
SEQ4() is distinct for every row of one GENERATOR call, so ordering by it is unique. ROW_NUMBER()
renumbers it because SEQ4() alone may leave gaps.
"""

[[rules.rule_exceptions]]
rule = "SQLCLEAN018"
path = "models/staging/clickstream/stg_app_events.sql"
reason = """
Append-only feeds redeliver rows, so the source id repeats across loads and only (id, _loaded_at)
is unique, which the source's unique_per_delivery audit checks. Rules cannot use a two-column key
as proof. A redelivered row is identical to the original, so the window picks the same values
whichever copy ranks first.
"""

