# Edge-case area: raw partner payload feed with hand-picked JSON edge values, written by the fixed
# loaders in python/loaders/edge_cases.py. Not scaled by data_scale.
sources:
  - name: edge__partner_payloads
    description: >-
      Append-only partner order payloads holding JSON edge values, with the raw message text
      beside each parsed payload
    managed: true
    contract: enforced
    columns:
      - name: delivery_id
        type: VARCHAR
        nullable: false
        audits:
          - not_null
          - unique
      - name: message_id
        type: VARCHAR
        nullable: false
        audits:
          - not_null
      - name: partner_code
        type: VARCHAR
      - name: received_at
        type: TIMESTAMP_NTZ
      - name: payload
        type: VARIANT
      - name: payload_text
        type: VARCHAR
      - name: _loaded_at
        type: TIMESTAMP_NTZ
        nullable: false
        audits:
          - not_null
  - name: edge__gateway_callbacks
    description: >-
      Append-only payment gateway callbacks with timestamps as merchant wall-clock times, zoned
      values, nanosecond values, free text and epoch numbers in JSON
    managed: true
    contract: enforced
    columns:
      - name: callback_id
        type: VARCHAR
        nullable: false
        audits:
          - not_null
          - unique
      - name: merchant_zone
        type: VARCHAR
      - name: local_wall_time
        type: TIMESTAMP_NTZ
      - name: event_at
        type: TIMESTAMP_TZ
      - name: event_at_ns
        type: TIMESTAMP_NTZ(9)
      - name: event_time_text
        type: VARCHAR
      - name: business_date
        type: DATE
      - name: period_start
        type: TIMESTAMP_NTZ
      - name: period_end
        type: TIMESTAMP_NTZ
      - name: body
        type: VARIANT
      - name: _loaded_at
        type: TIMESTAMP_NTZ
        nullable: false
        audits:
          - not_null
  - name: edge__price_windows
    description: >-
      Price list windows per SKU whose open ends are written as sentinel dates at the edges of the
      calendar
    managed: true
    contract: enforced
    columns:
      - name: window_id
        type: VARCHAR
        nullable: false
        audits:
          - not_null
          - unique
      - name: sku
        type: VARCHAR
      - name: price_minor
        type: NUMBER(38,0)
      - name: valid_from
        type: TIMESTAMP_NTZ(6)
      - name: valid_to
        type: TIMESTAMP_NTZ(6)
      - name: _loaded_at
        type: TIMESTAMP_NTZ
        nullable: false
        audits:
          - not_null
  - name: edge__customer_profiles
    description: >-
      Append-only customer profile snapshots whose business update time is sometimes missing, with
      names and addresses in many scripts and partner order numbers beyond double precision
    managed: true
    contract: enforced
    columns:
      - name: profile_id
        type: VARCHAR
        nullable: false
        audits:
          - not_null
          - unique
      - name: customer_id
        type: VARCHAR
      - name: full_name
        type: VARCHAR
      - name: previous_full_name
        type: VARCHAR
      - name: first_name
        type: VARCHAR
      - name: middle_name
        type: VARCHAR
      - name: last_name
        type: VARCHAR
      - name: address_line1
        type: VARCHAR
      - name: address_line2
        type: VARCHAR
      - name: loyalty_tier
        type: VARCHAR
      - name: partner_order_number
        type: NUMBER(38,0)
      - name: profile_updated_at
        type: TIMESTAMP_NTZ
      - name: _loaded_at
        type: TIMESTAMP_NTZ
        nullable: false
        audits:
          - not_null
  - name: edge__ledger_entries
    description: >-
      Append-only order ledger lines from every channel, with amounts at full NUMBER precision,
      FLOAT exchange rates, quantities sent as text and mixed-case statuses
    managed: true
    contract: enforced
    columns:
      - name: entry_id
        type: VARCHAR
        nullable: false
        audits:
          - not_null
          - unique
      - name: order_ref
        type: VARCHAR
      - name: channel
        type: VARCHAR
      - name: line_no
        type: NUMBER(38,0)
      - name: sku
        type: VARCHAR
      - name: warehouse_code
        type: VARCHAR
      - name: quantity
        type: NUMBER(38,0)
      - name: quantity_text
        type: VARCHAR
      - name: unit_price_minor
        type: NUMBER(38,0)
      - name: amount
        type: NUMBER(38,10)
      - name: currency_code
        type: VARCHAR
      - name: fx_rate
        type: FLOAT
      - name: status
        type: VARCHAR
      - name: reason_code
        type: VARCHAR
      - name: customer_tier
        type: VARCHAR
      - name: changed_at
        type: TIMESTAMP_NTZ
      - name: _loaded_at
        type: TIMESTAMP_NTZ
        nullable: false
        audits:
          - not_null
  - name: edge__ticket_notes
    description: >-
      Append-only support ticket notes whose text holds order references, quotes, backslashes and
      separators, with the campaign and discount code the customer arrived with
    managed: true
    contract: enforced
    columns:
      - name: note_id
        type: VARCHAR
        nullable: false
        audits:
          - not_null
          - unique
      - name: body
        type: VARCHAR
      - name: tags_text
        type: VARCHAR
      - name: utm_source
        type: VARCHAR
      - name: discount_code
        type: VARCHAR
      - name: sku
        type: VARCHAR
      - name: _loaded_at
        type: TIMESTAMP_NTZ
        nullable: false
        audits:
          - not_null
  - name: edge__partner_listings
    description: >-
      Partner listing snapshots whose feed names columns in quoted camelCase, which only quoted
      references can read
    managed: true
    contract: enforced
    columns:
      - name: '"listingId"'
        type: VARCHAR
        nullable: false
      - name: '"unitPriceMinor"'
        type: NUMBER(38,0)
      - name: '"listingStatus"'
        type: VARCHAR
      - name: _loaded_at
        type: TIMESTAMP_NTZ
        nullable: false
        audits:
          - not_null
  - name: edge__delivery_updates
    description: >-
      Shipment delivery change log delivered in two loads, the second carrying late older versions,
      a redelivered version, a delete and new versions
    managed: true
    contract: enforced
    columns:
      - name: delivery_id
        type: VARCHAR
        nullable: false
        audits:
          - not_null
          - unique
      - name: shipment_id
        type: VARCHAR
        nullable: false
        audits:
          - not_null
      - name: order_ref
        type: VARCHAR
      - name: delivery_status
        type: VARCHAR
      - name: ordered_on
        type: DATE
      - name: delivered_on
        type: DATE
      - name: _op
        type: VARCHAR
        nullable: false
        audits:
          - accepted_values:
              values: ["I", "U", "D"]
      - name: _seq
        type: NUMBER(38,0)
        nullable: false
        audits:
          - not_null
      - name: _loaded_at
        type: TIMESTAMP_NTZ
        nullable: false
        audits:
          - not_null
  - name: edge__basket_lines
    description: >-
      Append-only basket lines with a free-form tag per line, collected into arrays whose element
      order Snowflake does not define
    managed: true
    contract: enforced
    columns:
      - name: line_id
        type: VARCHAR
        nullable: false
        audits:
          - not_null
          - unique
      - name: basket_id
        type: VARCHAR
      - name: line_no
        type: NUMBER(38,0)
      - name: sku
        type: VARCHAR
      - name: tag
        type: VARCHAR
      - name: _loaded_at
        type: TIMESTAMP_NTZ
        nullable: false
        audits:
          - not_null
  - name: edge__date_texts
    description: >-
      Dates, zoned times and clock times as partners write them: unpadded fields, two-digit years,
      ISO separators, offsets in several spellings, and times with sub-millisecond digits
    managed: true
    contract: enforced
    columns:
      - name: text_id
        type: VARCHAR
        nullable: false
        audits:
          - not_null
          - unique
      - name: date_text
        type: VARCHAR
      - name: zoned_text
        type: VARCHAR
      - name: wall_clock
        type: TIMESTAMP_NTZ
      - name: wall_clock_text
        type: VARCHAR
      - name: local_time
        type: TIME
      - name: fine_time
        type: TIME
      - name: _loaded_at
        type: TIMESTAMP_NTZ
        nullable: false
        audits:
          - not_null
  - name: edge__amount_checks
    description: >-
      Reconciliation checks keyed by numbers of two widths and by text, with amounts at several
      scales, FLOAT ratios and raw JSON number text
    managed: true
    contract: enforced
    columns:
      - name: check_id
        type: VARCHAR
        nullable: false
        audits:
          - not_null
          - unique
      - name: group_code
        type: VARCHAR
      - name: narrow_key
        type: NUMBER(18,0)
      - name: wide_key
        type: NUMBER(38,0)
      - name: key_text
        type: VARCHAR
      - name: amount
        type: NUMBER(18,2)
      - name: fine_amount
        type: NUMBER(20,15)
      - name: ratio
        type: FLOAT
      - name: json_text
        type: VARCHAR
      - name: _loaded_at
        type: TIMESTAMP_NTZ
        nullable: false
        audits:
          - not_null
  - name: edge__variant_values
    description: >-
      Partner attribute values held as VARIANT, mixing numbers, strings, booleans, JSON nulls,
      objects with reordered keys and wide integers, with the raw text beside each
    managed: true
    contract: enforced
    columns:
      - name: value_id
        type: VARCHAR
        nullable: false
        audits:
          - not_null
          - unique
      - name: group_code
        type: VARCHAR
      - name: sort_key
        type: NUMBER(38,0)
      - name: attribute_value
        type: VARIANT
      - name: value_text
        type: VARCHAR
      - name: _loaded_at
        type: TIMESTAMP_NTZ
        nullable: false
        audits:
          - not_null
  - name: edge__category_links
    description: >-
      Catalogue category links for walking the category tree, with the shelf depth each category
      is displayed at
    managed: true
    contract: enforced
    columns:
      - name: category_id
        type: VARCHAR
        nullable: false
        audits:
          - not_null
          - unique
      - name: parent_id
        type: VARCHAR
      - name: category_name
        type: VARCHAR
      - name: shelf_depth
        type: NUMBER(38,0)
      - name: _loaded_at
        type: TIMESTAMP_NTZ
        nullable: false
        audits:
          - not_null
  - name: edge__supplier_notes
    description: >-
      Supplier notes whose columns are declared but whose contract is not enforced, so readers see
      an open source
    managed: true
    columns:
      - name: note_id
        type: VARCHAR
        nullable: false
        audits:
          - not_null
          - unique
      - name: supplier_code
        type: VARCHAR
      - name: note_text
        type: VARCHAR
      - name: _loaded_at
        type: TIMESTAMP_NTZ
        nullable: false
        audits:
          - not_null
